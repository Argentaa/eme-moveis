server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Limite de corpo do nginx. DEVE ficar ACIMA do MAX_UPLOAD_MB do backend
  # (hoje 50 MB). Sem esta linha vale o default do nginx, que e 1 MB: qualquer
  # anexo maior volta 413 aqui, ANTES de chegar no Flask, e a tela mostra o
  # limite do backend (25 MB) — numero que nao tem nada a ver com o bloqueio.
  # 60m = 50 MB do backend + folga para o overhead do multipart.
  client_max_body_size 60m;

  location /api/ {
    proxy_pass http://erp-backend:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }
  location ~* \.(js|css|png|svg|webmanifest|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
